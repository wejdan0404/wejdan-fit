name: WEJDAN FIT code quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check fit-data.js
          node --check sw.js
      - name: App regression tests
        run: node tests/regression.js
      - name: Offline package preflight
        run: |
          test -s index.html
          test -s manifest.webmanifest
          test -s assets/wejdan-w-reversed.svg
          test -s assets/icon-192.png
          test -s assets/icon-512.png
