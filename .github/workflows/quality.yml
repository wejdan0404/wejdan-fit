name: WEJDAN FIT code quality
on:
  push:
    branches: [main, "feature/masari-safe-merge-v1"]
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check exercise-coach.js
          node --check exercise-alternatives.js
          node --check fit-data.js
          node --check sw.js
          node --check masari-catalog.js
          node --check masari-migration.js
          node --check fit-core.js
          node --check fit-next.js
      - name: App regression tests
        run: |
          node tests/regression.js
          node tests/fit-core.test.js
          node tests/fit-next.test.js
          node tests/exercise-coach.test.js
          node tests/exercise-alternatives.test.js
      - name: Masari safe merge tests
        run: node tests/masari-merge.test.js
      - name: Offline package preflight
        run: |
          node tests/pwa-preflight.test.js
          test -s index.html
          test -s masari-catalog.js
          test -s masari-migration.js
          test -s fit-core.js
          test -s fit-next.js
          test -s exercise-alternatives.js
          test -s manifest.webmanifest
          test -s assets/wejdan-w-reversed.svg
          test -s assets/icon-192.png
          test -s assets/icon-512.png
